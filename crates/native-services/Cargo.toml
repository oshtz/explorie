[package]
name = "explorie-native-services"
version = "0.1.0"
edition = "2024"
authors = ["explorie contributors"]
description = "Tauri-free native services for the explorie desktop application."
license = "MIT"
repository = "https://github.com/oshtz/explorie"

[dependencies]
arrow-array = "59.2.0"
arrow-cast = "59.2.0"
arrow-ipc = { version = "59.2.0", features = ["lz4", "zstd"] }
asset-importer = { version = "0.8.0", features = ["static-link"] }
dirs = "5.0.1"
explorie-core = { path = "../core" }
explorie-plugin-protocol = { path = "../plugin-protocol" }
fontdue = "0.9.4"
html2text = "0.17.1"
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
hayro-syntax = "=0.7.2"
karet-pdf = "=0.5.0"
mail-parser = "0.11.8"
notify = "8.2.0"
open = "5"
parquet = { version = "59.2.0", default-features = false, features = ["brotli", "flate2-zlib-rs", "lz4", "snap", "zstd"] }
png = "0.18.0"
psd = "0.3.5"
pulldown-cmark = "0.13.4"
regex = "1.11"
resvg = "=0.45.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "symphonia-aiff", "symphonia-alac", "symphonia-caf", "vorbis", "wav"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
sysinfo = "0.30.5"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
uuid = { version = "1.8", features = ["v4"] }
wuff = "0.2.8"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
pollster = "0.2.5"
tempfile = "3.9"
