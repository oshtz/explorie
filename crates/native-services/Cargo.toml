[package]
name = "explorie-native-services"
version = "0.1.0"
edition = "2024"
authors = ["explorie contributors"]
description = "Tauri-free native services for the explorie desktop application."
license = "MIT"
repository = "https://github.com/oshtz/explorie"

[dependencies]
dirs = "5.0.1"
explorie-core = { path = "../core" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
karet-pdf = "=0.5.0"
notify = "8.2.0"
open = "5"
png = "0.18.0"
regex = "1.11"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
sysinfo = "0.30.5"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
uuid = { version = "1.8", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
pollster = "0.2.5"
tempfile = "3.9"
