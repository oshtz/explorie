[package]
name = "explorie-native-services"
version = "0.1.0"
edition = "2024"
authors = ["explorie contributors"]
description = "Tauri-free native services for the explorie desktop application."
license = "MIT"
repository = "https://github.com/oshtz/explorie"

[dependencies]
dirs = "5.0.1"
explorie-core = { path = "../core" }
notify = "8.2.0"
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.30.5"
uuid = { version = "1.8", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3.9"
