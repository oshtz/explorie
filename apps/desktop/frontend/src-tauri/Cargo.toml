[package]
name = "explorie-desktop"
version = "0.2.7"
edition = "2024"
description = "explorie desktop app (Tauri + React)"
build = "build.rs"
authors = ["explorie contributors"]
license = "MIT"
repository = "https://github.com/oshtz/explorie"

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-fs = "2.2.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2.4.2"
explorie-core = { path = "../../../../crates/core" }
explorie-native-services = { path = "../../../../crates/native-services" }
dirs = "5.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }
