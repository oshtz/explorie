[package]
name = "explorie-gpui"
version = "0.1.0"
edition = "2024"
authors = ["explorie contributors"]
description = "Native GPUI desktop foundation for explorie"
license = "MIT"
repository = "https://github.com/oshtz/explorie"

[dependencies]
explorie-core = { path = "../../../crates/core" }
gpui = { version = "=0.2.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
