[package]
name = "explorie-gpui"
version = "0.2.7"
edition = "2024"
authors = ["explorie contributors"]
description = "Native GPUI desktop application for explorie"
license = "MIT"
repository = "https://github.com/oshtz/explorie"

[dependencies]
explorie-core = { path = "../../../crates/core" }
explorie-native-services = { path = "../../../crates/native-services" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d029c5ff5654fb1b1e8caf4462993c8ee13a133", default-features = false }
image = { version = "0.25.1", default-features = false, features = ["png"] }
dirs = "5.0.1"
chrono = "0.4"
regex = "1.11"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d029c5ff5654fb1b1e8caf4462993c8ee13a133" }

[target.'cfg(windows)'.dependencies]
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "1d029c5ff5654fb1b1e8caf4462993c8ee13a133", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d029c5ff5654fb1b1e8caf4462993c8ee13a133", default-features = false, features = ["test-support"] }
pollster = "0.2.5"
