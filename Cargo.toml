[workspace]
resolver = "3"
members = [
    "crates/plugin-protocol",
    "plugins/syncthing",
    "plugins/git",
    "plugins/obsidian",
    "crates/core",
    "crates/native-services",
    "crates/ffmpeg-wrapper",
    "apps/cli",
    "apps/desktop/gpui"
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
