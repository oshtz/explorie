name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tag after real-machine validation
        type: boolean
        required: true
        default: false
      windows_real_machine_verified:
        description: Windows installer, folder-handler toggle/reversal, remote drives, and disposable filesystem operations passed
        type: boolean
        required: true
        default: false
      macos_real_machine_verified:
        description: Signed/notarized macOS install, launch, and disposable filesystem operations passed
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validate release source
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release checks
        run: pnpm release:check:test

      - name: Run release checks
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: pnpm release:check

      - name: Validate publication attestation
        if: inputs.publish == true
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publication must be dispatched from the validated version tag."
            exit 1
          fi
          if [ "${{ inputs.windows_real_machine_verified }}" != "true" ] || [ "${{ inputs.macos_real_machine_verified }}" != "true" ]; then
            echo "Both candidate packages require real-machine filesystem-operation attestation."
            exit 1
          fi

      - name: Upload release-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: |
            .release-checks/latest.json
            .release-checks/latest.md
          if-no-files-found: warn

      - name: Validate release state
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$EVENT_NAME" = "push" ] && [ "$state" != "missing" ]; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] && [ "$state" != "true" ]; then
            echo "Release $GITHUB_REF_NAME must exist as a draft before publication."
            exit 1
          fi

  build-windows:
    name: Package Windows
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native file operations on Windows
        run: cargo test -p explorie-core

      - name: Prepare native dependencies
        run: |
          node scripts/prepare-rclone.mjs
          node scripts/prepare-winfsp.mjs

      - name: Build GPUI Windows application
        shell: pwsh
        run: |
          cargo build -p explorie-gpui --release --locked
          if ($LASTEXITCODE -ne 0) { throw "GPUI release build failed." }
          Copy-Item -LiteralPath "apps/desktop/native-assets/binaries/rclone-x86_64-pc-windows-msvc.exe" -Destination "target/release/rclone.exe" -Force

      - name: Verify bundled native dependencies
        shell: pwsh
        run: |
          $rclone = "target/release/rclone.exe"
          if (-not (Test-Path -LiteralPath $rclone -PathType Leaf)) { throw "Bundled rclone executable was not built." }
          $version = & $rclone version | Select-Object -First 1
          if ($version -ne "rclone v1.74.4") { throw "Unexpected bundled rclone version: $version" }
          $winfsp = "apps/desktop/native-assets/resources/winfsp-2.1.25156.msi"
          if (-not (Test-Path -LiteralPath $winfsp -PathType Leaf)) { throw "Bundled WinFsp installer was not prepared." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $winfsp).Hash.ToLowerInvariant()
          if ($hash -ne "073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a") { throw "WinFsp installer hash mismatch." }
          $signature = Get-AuthenticodeSignature -LiteralPath $winfsp
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "NAVIMATICS") {
            throw "WinFsp installer signature is invalid."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw "The runner image does not provide Inno Setup 6." }
          pwsh -NoProfile -File scripts/package-gpui-windows.ps1 -IsccPath $iscc
          if ($LASTEXITCODE -ne 0) { throw "Windows installer packaging failed." }

      - name: Stage unsigned Windows installer and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release-artifacts/windows/explorie-$version-windows-x64-setup.exe"
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne "NotSigned") {
            throw "Unsigned installer has an unexpected Authenticode status."
          }
          $unsigned = "release-artifacts/windows/explorie-$version-windows-x64-setup-unsigned.exe"
          Move-Item -LiteralPath $installer -Destination $unsigned
          $installer = $unsigned

          $staging = "release-artifacts/windows"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash *$(Split-Path $installer -Leaf)" | Set-Content -Encoding ascii (Join-Path $staging "SHA256SUMS-windows.txt")

      - name: Download previous Windows installer when available
        id: previous-windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          $assets = @($release.assets | Where-Object { $_.name -like "explorie-*-windows-x64-setup-unsigned.exe" })
          if ($assets.Count -gt 1) { throw "The latest release has multiple Windows installer assets." }
          if ($assets.Count -eq 1) {
            $checksums = @($release.assets | Where-Object { $_.name -eq "SHA256SUMS-windows.txt" })
            if ($checksums.Count -ne 1) { throw "The previous Windows installer has no unique checksum manifest." }
            $destination = Join-Path $env:RUNNER_TEMP $assets[0].name
            $checksumPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS-windows-previous.txt"
            Invoke-WebRequest -Uri $assets[0].browser_download_url -OutFile $destination
            Invoke-WebRequest -Uri $checksums[0].browser_download_url -OutFile $checksumPath
            $escapedName = [Regex]::Escape($assets[0].name)
            $checksumPattern = '^([0-9a-fA-F]{64})\s+\*?' + $escapedName + '$'
            $entries = @(Get-Content -LiteralPath $checksumPath | Where-Object { $_ -match $checksumPattern })
            if ($entries.Count -ne 1) { throw "The previous installer checksum entry is missing or ambiguous." }
            $expected = ([Regex]::Match($entries[0], "^[0-9a-fA-F]{64}")).Value.ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "The previous Windows installer checksum does not match." }
            "path=$destination" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "No previous Windows installer exists; this release will establish the upgrade baseline."
          }

      - name: Smoke test Windows installer
        shell: pwsh
        env:
          PREVIOUS_INSTALLER: ${{ steps.previous-windows.outputs.path }}
        run: |
          $installer = @(Get-ChildItem release-artifacts/windows/*-windows-x64-setup*.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one Windows installer." }
          $installDir = Join-Path $env:RUNNER_TEMP "explorie-installed"
          $configDir = Join-Path $env:APPDATA "explorie"
          $marker = Join-Path $configDir "installer-upgrade-smoke.txt"
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          Set-Content -LiteralPath $marker -Value "preserve across upgrade" -Encoding utf8
          if ($env:PREVIOUS_INSTALLER) {
            $previous = Start-Process -FilePath $env:PREVIOUS_INSTALLER -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
            if ($previous.ExitCode -ne 0) { throw "Previous installer exited with code $($previous.ExitCode)." }
          }
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $app = Join-Path $installDir "Explorie.exe"
          $rclone = Join-Path $installDir "rclone.exe"
          try {
            if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw "Installed Explorie executable was not found." }
            if (-not (Test-Path -LiteralPath $rclone -PathType Leaf)) { throw "Installed rclone executable was not found." }
            if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne "preserve across upgrade") { throw "User data did not survive the installer upgrade." }
            pwsh -NoProfile -File scripts/smoke-gpui-release.ps1 -Executable $app
            if ($LASTEXITCODE -ne 0) { throw "Installed GPUI smoke check failed." }
            $version = & $rclone version | Select-Object -First 1
            if ($version -ne "rclone v1.74.4") { throw "Unexpected installed rclone version: $version" }
          } finally {
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
            }
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: explorie-windows
          path: release-artifacts/windows/*
          if-no-files-found: error

  build-macos:
    name: Package macOS
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Test GPUI-native application on macOS
        run: cargo test -p explorie-core -p explorie-native-services -p explorie-ffmpeg-wrapper -p explorie-cli -p explorie-gpui

      - name: Check Apple signing prerequisites
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          available=true
          for value in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!value}" ]; then available=false; fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$available" != "true" ]; then
            echo "Tagged releases require all Apple signing and notarization secrets."
            exit 1
          fi
          if [ "$available" != "true" ]; then
            echo "::warning::Manual macOS package will use an ad-hoc signature and will not be notarized."
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" = "true" ]; then
            echo "identity=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          else
            echo "identity=-" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificate
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build GPUI macOS app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPLORIE_MACOS_TARGET: aarch64-apple-darwin
        run: |
          node scripts/prepare-rclone.mjs aarch64-apple-darwin
          cargo build -p explorie-gpui --release --locked --target aarch64-apple-darwin
          bash scripts/package-gpui-macos.sh

      - name: Notarize and staple macOS DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          app="target/release/bundle/macos/explorie.app"
          app_zip="$RUNNER_TEMP/explorie-notarization.zip"
          test -d "$app"
          ditto -c -k --keepParent "$app" "$app_zip"
          xcrun notarytool submit "$app_zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app"

          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}."
            exit 1
          fi
          dmg_root="target/release/bundle/dmg-root"
          rm -rf "$dmg_root/explorie.app"
          ditto "$app" "$dmg_root/explorie.app"
          rm -f "${dmgs[0]}"
          hdiutil create \
            -volname explorie \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "${dmgs[0]}"
          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"

      - name: Verify and stage macOS package
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}."
            exit 1
          fi

          mount_point=$(mktemp -d)
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT

          apps=("$mount_point"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one app in the DMG."
            exit 1
          fi
          app="${apps[0]}"
          helper="$app/Contents/Resources/explorie-mountd"
          rclone="$app/Contents/MacOS/rclone"
          rclone_license="$app/Contents/Resources/licenses/rclone-COPYING"
          pixelarticons_license="$app/Contents/Resources/licenses/pixelarticons-LICENSE.txt"
          helper_plist="$app/Contents/Library/LaunchDaemons/com.omershatz.explorie.mountd.plist"
          test -x "$helper"
          test -x "$rclone"
          test -f "$rclone_license"
          test -f "$pixelarticons_license"
          test -f "$helper_plist"
          test "$("$rclone" version | head -n 1)" = 'rclone v1.74.4'
          /usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$helper_plist" | grep -Fx 'Contents/Resources/explorie-mountd'
          /usr/libexec/PlistBuddy -c 'Print :AssociatedBundleIdentifiers:0' "$helper_plist" | grep -Fx 'com.omershatz.explorie'
          codesign --verify --strict --verbose=2 "$helper"
          codesign --verify --strict --verbose=2 "$rclone"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=4 "$helper" 2>&1 | grep -Fx 'Identifier=com.omershatz.explorie.mountd'
          codesign -d --verbose=4 "$app" 2>&1 | grep -Fx 'Identifier=com.omershatz.explorie'
          codesign -d --verbose=4 "$helper" 2>&1 | grep -E 'flags=.*runtime'
          codesign -d --verbose=4 "$app" 2>&1 | grep -E 'flags=.*runtime'
          if [ "$APPLE_SIGNING_AVAILABLE" = "true" ]; then
            codesign -d --verbose=4 "$helper" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
            codesign -d --verbose=4 "$rclone" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
            codesign -d --verbose=4 "$app" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            xcrun stapler validate "$app"
            xcrun stapler validate "${dmgs[0]}"
            spctl --assess --type execute --verbose=2 "$app"
            spctl --assess --type open --context context:primary-signature --verbose=2 "${dmgs[0]}"
          fi
          cleanup
          trap - EXIT

          version=$(node -p "require('./package.json').version")
          mkdir -p release-artifacts/macos
          asset="release-artifacts/macos/explorie-$version-macos-arm64.dmg"
          cp "${dmgs[0]}" "$asset"
          (cd release-artifacts/macos && shasum -a 256 "$(basename "$asset")" > SHA256SUMS-macos.txt)

      - name: Smoke test macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then exit 1; fi

          mount_point=$(mktemp -d)
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          cleanup() { hdiutil detach "$mount_point" -quiet || true; }
          trap cleanup EXIT

          apps=("$mount_point"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one app in the DMG."
            exit 1
          fi
          installed_app="$RUNNER_TEMP/explorie-smoke-$GITHUB_RUN_ID.app"
          ditto "${apps[0]}" "$installed_app"
          cleanup
          trap - EXIT

          binary="$installed_app/Contents/MacOS/explorie-gpui"
          rclone="$installed_app/Contents/MacOS/rclone"
          if [ ! -x "$binary" ]; then
            echo "Installed application executable was not found."
            exit 1
          fi
          test -x "$rclone"
          test "$("$rclone" version | head -n 1)" = 'rclone v1.74.4'
          "$binary" >"$RUNNER_TEMP/explorie-smoke.log" 2>&1 &
          app_pid=$!
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/explorie-smoke.log"
            echo "Installed application exited during launch smoke test."
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: explorie-macos
          path: release-artifacts/macos/*
          if-no-files-found: error

  candidate:
    name: Create draft candidate release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download candidate packages
        uses: actions/download-artifact@v4
        with:
          pattern: explorie-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify packages and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum --check SHA256SUMS-windows.txt
          sha256sum --check SHA256SUMS-macos.txt
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish:
    name: Publish verified draft release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      inputs.publish == true &&
      inputs.windows_real_machine_verified == true &&
      inputs.macos_real_machine_verified == true
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download and verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-artifacts
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'explorie-*' \
            --pattern 'SHA256SUMS-*' \
            --dir release-artifacts
          cd release-artifacts
          sha256sum --check SHA256SUMS-windows.txt
          sha256sum --check SHA256SUMS-macos.txt
          shopt -s nullglob
          windows=(explorie-*-windows-x64-setup*.exe)
          macos=(explorie-*-macos-arm64.dmg)
          if [ "${#windows[@]}" -ne 1 ] || [ "${#macos[@]}" -ne 1 ]; then
            echo "Draft release must contain exactly one Windows installer and one macOS DMG."
            exit 1
          fi

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
