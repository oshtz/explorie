name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-rust:
    name: Rust Tests & Coverage
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare native dependencies
        run: |
          node scripts/prepare-rclone.mjs
          node scripts/prepare-winfsp.mjs

      - name: Run GPUI-native tests with coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info -p explorie-core -p explorie-native-services -p explorie-ffmpeg-wrapper -p explorie-cli -p explorie-gpui

      - name: Build GPUI Windows release
        run: cargo build -p explorie-gpui --release --locked

      - name: Smoke test GPUI Windows release
        run: pwsh -NoProfile -File scripts/smoke-gpui-release.ps1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 30

      - name: Coverage summary
        shell: bash
        run: |
          echo "## Rust Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f lcov.info ]; then
            cargo llvm-cov report --summary-only 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

  test-rust-macos:
    name: macOS GPUI Tests & Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Test GPUI-native application on macOS
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo test -p explorie-core -p explorie-native-services -p explorie-ffmpeg-wrapper -p explorie-cli
          cargo test -p explorie-gpui -- --test-threads=1

      - name: Build GPUI macOS application
        run: cargo build -p explorie-gpui --release --locked

  test-rust-unix-safety:
    name: Unix Safety Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Test real RAR extraction safety
        run: cargo test -p explorie-core real_rar_fixture_extracts_and_enforces_budget_and_cancellation

      - name: Test Unix journal and helper lifecycle safety
        run: cargo test -p explorie-native-services unix_

  lint:
    name: Native Lint & Release Contracts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare native dependencies
        run: |
          node scripts/prepare-rclone.mjs
          node scripts/prepare-winfsp.mjs

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: GPUI-native Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Release workflow tests
        run: pnpm release:check:test

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cargo audit
        run: |
          set -o pipefail
          echo "## Rust Security Audit" >> $GITHUB_STEP_SUMMARY
          cargo audit 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Run pnpm audit
        run: |
          set -o pipefail
          echo "## Node.js Security Audit" >> $GITHUB_STEP_SUMMARY
          corepack pnpm@11.13.0 audit --audit-level=moderate 2>&1 | tee -a $GITHUB_STEP_SUMMARY
