name: Validate macOS UI

on:
  pull_request:
    paths:
      - '.github/workflows/build-release.yml'
      - '.github/workflows/validate-macos-ui.yml'
      - 'apps/desktop/gpui/**'
      - 'crates/native-services/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-macos-ui:
    name: CoreText and Metal rendering
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: './ -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify CoreText glyphs reach the Metal renderer
        env:
          EXPLORIE_RENDER_PROBE_OUTPUT: target/macos-render-probe.png
        run: cargo run --locked -p explorie-gpui --example macos_render_probe

      - name: Upload macOS rendering proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-render-probe
          path: target/macos-render-probe.png
          if-no-files-found: warn
