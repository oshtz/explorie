name: Validate macOS UI

on:
  pull_request:
    paths:
      - '.github/workflows/build-release.yml'
      - '.github/workflows/validate-macos-ui.yml'
      - 'apps/desktop/gpui/**'
      - 'crates/native-services/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-macos-ui:
    name: CoreText and Metal rendering
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Verify CoreText glyphs reach the Metal renderer
        env:
          EXPLORIE_RENDER_PROBE_OUTPUT: target/macos-render-probe.png
        run: cargo run --locked -p explorie-gpui --example macos_render_probe

      - name: Test native macOS UI behavior
        run: cargo test --locked -p explorie-gpui

      - name: Upload macOS rendering proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-render-probe
          path: target/macos-render-probe.png
          if-no-files-found: warn
